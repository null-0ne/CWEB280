services:
  dev:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-trixie
    volumes:
      - ..:/workspace:cached

    working_dir: /workspace
    command: sleep infinity

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cweb

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: