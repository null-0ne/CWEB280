<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AJAX with Express Example</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg p-6 space-y-4">
    <h1 class="text-2xl font-bold text-blue-600">Posts from Express API</h1>
    <button id="loadBtn"
      class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
      Load Posts
    </button>
    <ul id="postsList" class="list-disc pl-5 space-y-2"></ul>
  </div>

  <script>
    document.getElementById("loadBtn").addEventListener("click", async() => {
        try{
        const response = await fetch("/api/posts");
        const data = await response.json();
        const list = document.getElementById("postsList");
        list.innerHTML = "";
        data.forEach(post => {
            const li = document.createElement("li");
            li.textContent = `${post.id}. ${post.title}`;
            list.appendChild(li);
        });
    }
    catch(err){
        console.error(err);
    }
    //   fetch("/api/posts")
    //     .then(response => response.json())
    //     .then(data => {
    //       const list = document.getElementById("postsList");
    //       list.innerHTML = "";
    //       data.forEach(post => {
    //         const li = document.createElement("li");
    //         li.textContent = `${post.id}. ${post.title}`;
    //         list.appendChild(li);
    //       });
    //     })
    //     .catch(err => console.error("Error fetching posts:", err));
    });
  </script>
</body>
</html>
